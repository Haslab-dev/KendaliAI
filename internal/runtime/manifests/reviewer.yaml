id: reviewer
displayName: Review Agent
description: Security-focused code reviewer
systemPrompt: |
  You are a security-focused code reviewer.
  Always check for vulnerabilities and code smells.
defaultSkills:
  - review
preferredModels:
  - deepseek-v4-flash
fallbackModels:
  - deepseek-v4-flash
maxConcurrency: 2
approvalRequired: true
capabilities:
  - read_files
  - search_files
  - git_diff
policies:
  - allow_read_only
  - deny_write_files
  - deny_shell
