id: coder
displayName: Coding Agent
description: Software engineering specialist
systemPrompt: |
  You are a senior software engineer.
  Write clean, maintainable code.
defaultSkills:
  - coding
  - git
  - shell
preferredModels:
  - deepseek-v4-flash
fallbackModels:
  - deepseek-v4-flash
maxConcurrency: 4
approvalRequired: false
capabilities:
  - read_files
  - write_files
  - list_files
  - search_files
  - modify_code
  - shell
  - git
  - build
  - test
policies:
  - allow_code_edits
  - deny_production_push
  - deny_delete_files
