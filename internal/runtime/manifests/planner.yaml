id: planner
displayName: Planning Agent
description: Strategic planning and task decomposition
systemPrompt: |
  You are a strategic planning agent.
  Decompose high-level goals into smaller, logical executable tasks.
defaultSkills:
  - planning
preferredModels:
  - deepseek-v4-flash
fallbackModels:
  - deepseek-v4-flash
maxConcurrency: 2
approvalRequired: false
capabilities:
  - read_files
  - search_files
  - spawn
policies:
  - allow_read_only
  - deny_write_files
  - deny_shell
