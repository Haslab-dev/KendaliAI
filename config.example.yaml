version: 1

database:
  path: ./build/kendaliai.db

defaultProvider: openai-compatible

chatProviders:
  - name: openai-compatible
    type: openai
    apiKey: your-openai-key-here
    endpoint: https://api.openai.com/v1
    model: gpt-4o
  - name: deepseek
    type: deepseek
    apiKey: your-deepseek-key-here
    model: deepseek-chat

embedding:
  apiKey: your-openai-key-here
  endpoint: https://api.openai.com/v1
  model: text-embedding-3-small

channels:
  - id: telegram-main
    channelName: telegram
    channelType: telegram
    token: your-telegram-token-here

# Object storage for generated artifacts, uploads, and session data.
# Provider options: local (filesystem), r2 (Cloudflare R2 / S3-compatible)
storage:
  provider: local
  bucket: kendaliai
  localPath: ./storage

  # For Cloudflare R2 or S3-compatible providers, use:
  # provider: r2
  # endpoint: https://xxxxx.r2.cloudflarestorage.com
  # accessKey: your-access-key
  # secretKey: your-secret-key
  # publicUrl: https://cdn.example.com
  # region: auto
