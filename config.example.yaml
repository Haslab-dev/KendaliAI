version: 1

database:
  path: ./build/kendaliai.db

defaultProvider: openai-compatible

chatProviders:
  - name: openai-compatible
    type: openai
    apiKey: your-openai-key-here
    endpoint: https://api.openai.com/v1
    model: gpt-4o
  - name: deepseek
    type: deepseek
    apiKey: your-deepseek-key-here
    model: deepseek-chat

embedding:
  apiKey: your-openai-key-here
  endpoint: https://api.openai.com/v1
  model: text-embedding-3-small

channels:
  - id: telegram-main
    channelName: telegram
    channelType: telegram
    token: your-telegram-token-here

# MCP Servers (Remote HTTP or local CLI tool servers)
mcpServers:
  firecrawl:
    type: http
    url: https://mcp.firecrawl.dev/v2/mcp
    headers:
      Authorization: "Bearer <FIRECRAWL_API_KEY>"
  exa:
    type: http
    url: "https://mcp.exa.ai/mcp?tools=web_search_exa,web_fetch_exa,agent_run"
    headers:
      x-api-key: "YOUR_EXA_API_KEY"

# Object storage for generated artifacts, uploads, and session data.
# Local storage is ALWAYS auto-available — no config needed.
# Cloudflare R2 / S3-compatible is optional, added on top of local.
storage:
  provider: local
  localPath: ./storage

  # Optional: add Cloudflare R2 on top of local storage
  # r2:
  #   bucket: kendaliai
  #   endpoint: https://xxxxx.r2.cloudflarestorage.com
  #   accessKey: your-access-key
  #   secretKey: your-secret-key
  #   publicUrl: https://cdn.example.com
  #   region: auto

# File access permissions. Deny-list takes priority over allow-list.
# Built-in sensitive patterns (config.yaml, .env, .git/, .ssh/, *.key, *.pem, etc.) are ALWAYS denied.
permissions:
  deny:
    - secrets/
    - credentials/
    - tokens/
  allow:
    - path: example/
      permissions: [read, write, update, delete]
    - path: public/
      permissions: [read, write, update, delete]
    - path: ./
      permissions: [read]

# Native function calling (OpenAI tools API). Enabled by default for
# providers that support it; providers that reject it fall back to the legacy
# `tool: NAME({...})` text protocol automatically. Set false to always use
# the text protocol.
# nativeTools: false

# Daily reflection daemon — runs at midnight, generates timeline and auto-skills
reflection:
  enabled: true
  schedule: "0 0 * * *"
  timezone: Asia/Jakarta

# macOS computer use — lets the chat agent open apps, type, click, take
# screenshots and read accessible UI text (Calculator, dialogs, etc).
# Enabled by default on macOS; per-execution still subject to agent policies.
# Set enabled: false to remove the computer_* tools from the agent.
computerUse:
  enabled: true

# Browser use — lets the chat agent drive a real Chromium (navigate, click,
# type, scroll, read text, screenshot) with a persistent profile under
# ~/.kendaliai/browser/profile. Headless by default; set headless: false to
# watch the browser window while the agent works.
browserUse:
  enabled: true
  headless: true

# Embedded RakitKode engine (optional). kind: rakit routes web-chat turns
# through the ForgeADE-proven coding-agent harness; empty/"builtin" keeps the
# legacy gateway runtime. jevApiKey enables the engine's remote tool-routing
# classifier (Typesafe AI Jev) — fewer tools offered per turn means less
# token bloat; empty keeps local keyword-heuristic routing. jevEndpoint only
# needed for self-hosted/proxied classifier deployments.
# engine:
#   kind: rakit
#   workspace: /path/to/default/project
#   autoApprove: true
#   syncProviders: true
#   jevApiKey: ""
#   jevEndpoint: ""
