{
  "id": "docx",
  "name": "Docx Converter",
  "displayName": "DOCX Converter",
  "version": "1.0.0",
  "description": "Converts between DOCX and other formats using python-docx and mammoth.",
  "author": "KendaliAI",
  "license": "MIT",
  "category": "example",
  "keywords": ["docx", "word", "convert", "document", "mammoth"],
  "routing": {
    "keywords": ["docx", "word", "convert", "document", "word to", "to word"],
    "threshold": 0.65
  },
  "tools": {
    "allowed": ["exec", "read_file", "write_file"],
    "denied": []
  },
  "dependencies": {
    "python": ["python-docx", "mammoth"],
    "system": ["libreoffice"]
  },
  "memory": {
    "enabled": false
  },
  "examples": {
    "enabled": true
  },
  "lifecycle": {
    "onInstall": "build_embeddings",
    "onDelete": "remove_embeddings"
  },
  "prompt": "prompt.md"
}
