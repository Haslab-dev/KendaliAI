id: docx
name: DOCX Processor
displayName: DOCX Processor
version: 1.0.0
description: Demonstrates KSP dependencies by requiring external tools for document processing.
author: KendaliAI
license: MIT
category: example
keywords:
  - docx
  - document
  - word
  - processing
  - dependencies
routing:
  keywords:
    - docx
    - document
    - word
    - convert
    - extract
  threshold: 0.65
tools:
  allowed:
    - exec
    - read_file
    - write_file
  denied: []
dependencies:
  packages:
    apt:
      - libreoffice
      - pandoc
    brew:
      - libreoffice
      - pandoc
memory:
  enabled: false
examples:
  enabled: true
lifecycle:
  onInstall: build_embeddings
  onDelete: remove_embeddings
prompt: prompt.md
