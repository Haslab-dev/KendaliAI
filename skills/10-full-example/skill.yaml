{
  "id": "full-example",
  "name": "Full Example",
  "displayName": "Complete KSP Reference",
  "version": "1.0.0",
  "description": "Complete KSP skill demonstrating all features: prompts, tools, hooks, resources, dependencies, MCP, memory, and lifecycle.",
  "author": "KendaliAI",
  "license": "MIT",
  "category": "example",
  "keywords": ["complete", "full", "reference", "all features", "example"],
  "routing": {
    "keywords": ["example", "demo", "reference", "complete", "all features"],
    "threshold": 0.7
  },
  "tools": {
    "allowed": ["exec", "read_file", "write_file", "apply_patch"],
    "denied": ["delete_file"],
    "defs": {
      "run-tests": "tools/run-tests.sh",
      "build": "tools/build.sh",
      "deploy": "tools/deploy.sh"
    }
  },
  "hooks": {
    "install": {
      "pre": "hooks/pre_install.sh",
      "post": "hooks/post_install.sh"
    },
    "execution": {
      "pre": "hooks/pre_run.sh",
      "post": "hooks/post_run.sh"
    }
  },
  "dependencies": {
    "packages": {
      "npm": ["typescript", "eslint", "prettier"],
      "apt": ["nodejs", "npm"]
    }
  },
  "mcp": {
    "servers": ["filesystem", "web-search"]
  },
  "memory": {
    "enabled": true,
    "retention": 30,
    "index": "memory/index.json"
  },
  "resources": {
    "templates": ["resources/templates/*.md"],
    "docs": ["resources/docs/*.md"],
    "assets": ["resources/assets/*"]
  },
  "examples": {
    "enabled": true,
    "path": "examples.md"
  },
  "lifecycle": {
    "onInstall": "build_embeddings",
    "onDelete": "remove_embeddings",
    "onUpdate": "rebuild_embeddings"
  },
  "metadata": {
    "readme": "README.md",
    "changelog": "CHANGELOG.md",
    "license": "LICENSE"
  },
  "prompt": "prompt.md"
}
