{
  "id": "external-import",
  "name": "External Import",
  "displayName": "External Skill Import",
  "version": "1.0.0",
  "description": "Demonstrates importing and converting external skills from Claude/Hermes format to KSP.",
  "author": "KendaliAI",
  "license": "MIT",
  "category": "example",
  "keywords": ["import", "external", "claude", "hermes", "convert"],
  "routing": {
    "keywords": ["import", "external", "add skill", "convert", "claude skills"],
    "threshold": 0.7
  },
  "tools": {
    "allowed": ["exec", "read_file", "write_file"],
    "denied": []
  },
  "memory": {
    "enabled": false
  },
  "examples": {
    "enabled": true
  },
  "lifecycle": {
    "onInstall": "build_embeddings",
    "onDelete": "remove_embeddings"
  },
  "prompt": "prompt.md"
}
