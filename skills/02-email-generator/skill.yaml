id: email-generator
name: Email Generator
displayName: Email Generator
version: 1.0.0
description: Demonstrates KSP resources using templates for generating emails.
author: KendaliAI
license: MIT
category: example
keywords:
  - email
  - template
  - resources
  - generator
routing:
  keywords:
    - email
    - template
    - invoice
    - reminder
    - generate
  threshold: 0.65
tools:
  allowed:
    - read_file
    - write_file
    - apply_patch
  denied: []
memory:
  enabled: true
examples:
  enabled: true
lifecycle:
  onInstall: build_embeddings
  onDelete: remove_embeddings
prompt: prompt.md
resources:
  templates:
    - invoice.md
    - reminder.md
